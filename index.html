<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighting Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Epic Fighting Game</h1>
    </header>

    <main>
        <section id="character-selection">
            <h2>Choose Your Fighter</h2>
            <div class="character-list">
                <div class="character-card" data-character-id="char1">
                    <img src="https://via.placeholder.com/100x80.png?text=Fighter1" alt="Fighter 1">
                    <h3>Fighter 1</h3>
                    <p>Special Move: Punch</p>
                </div>
                <div class="character-card" data-character-id="char2">
                    <img src="https://via.placeholder.com/100x80.png?text=Fighter2" alt="Fighter 2">
                    <h3>Fighter 2</h3>
                    <p>Special Move: Kick</p>
                </div>
                <div class="character-card" data-character-id="char3">
                    <img src="https://via.placeholder.com/100x80.png?text=Fighter3" alt="Fighter 3">
                    <h3>Fighter 3</h3>
                    <p>Special Move: Block</p>
                </div>
                </div>
        </section>

        <section id="fight-arena">
            <h2>Arena</h2>
            <div class="arena">
                <div id="player1">
                    </div>
                <div id="player2">
                    </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Fighting Game</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
